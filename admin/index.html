<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,viewport-fit=cover" />
  <title>Admin — .kontora</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand__dot">.</span>kontora admin</a>
    <nav class="nav"><a href="../index.html">На сайт</a><a href="/auth/" id="logoutBtn">Выйти</a></nav>
  </header>

  <main class="admin-main">
    <section class="section admin-shell">
      <div class="section__head">
        <div>
          <h2>Публикация витрины</h2>
          <p>Интерфейс уровня «серьёзная организация»: каталог слева, полная форма редактирования справа.</p>
        </div>
        <span id="syncState" class="mini"></span>
      </div>

      <div id="panel" class="panel">
        <aside>
          <button id="addBtn" class="mini" type="button">+ Добавить товар</button>
          <div id="itemList" class="item-list"></div>
        </aside>
        <section>
          <div id="editor" class="editor"></div>
          <div class="toolbar">
            <button id="saveBtn" class="mini" type="button">Сохранить</button>
            <button id="exportBtn" class="mini" type="button">Экспорт JSON</button>
            <label class="mini">Импорт JSON<input id="importFile" type="file" hidden accept="application/json" /></label>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script defer src="../firebase-init.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
