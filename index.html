<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,viewport-fit=cover,user-scalable=yes" />
  <meta name="theme-color" content="#08090c" />
  <title>.kontora — каталог ПК</title>
  <meta name="description" content="Готовые компьютеры и комплектующие. Быстрый переход к контактам." />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/desktop.css" media="(min-width: 901px)" />
  <link rel="stylesheet" href="styles/mobile.css" media="(max-width: 900px)" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#hero"><span class="brand__dot">.</span>kontora</a>
    <nav class="nav">
      <a href="#catalog">Каталог</a>
      <a href="#reviews">Отзывы</a>
      <a id="adminLink" href="admin/">Админ</a>
      <span id="authStatus" class="mini auth-pill">Профиль: не выполнен</span>
      <a id="authAction" class="mini" href="auth/">Войти</a>
    </nav>
  </header>

  <a class="contact-fab" href="#contacts">Контакты</a>

  <main>
    <section id="hero" class="hero">
      <div class="hero__sticky">
        <h1><span class="hero__line">KONTORA</span><span class="hero__line hero__line--muted">est.2019</span></h1>
        <img id="heroPc" class="hero__pc" src="https://i.postimg.cc/DfqdMBVk/27367CFA-6E85-469F-A438-A1EDC62D7600.png" alt="Компьютер KONTORA" draggable="false" />
      </div>
    </section>

    <section id="catalog" class="section">
      <div class="section__head">
        <div>
          <h2>Каталог</h2>
          <p>Готовые компьютеры и комплектующие/периферия.</p>
        </div>
        <button id="resetCatalog" class="mini" type="button">Сбросить локальные правки</button>
      </div>
      <div id="filters" class="filters"></div>
      <div id="catalogGrid" class="grid"></div>
    </section>

    <section id="reviews" class="section">
      <div class="section__head"><h2>Отзывы клиентов</h2></div>
      <div class="reviews-marquee">
        <div class="reviews-track" id="reviewsTrack"></div>
      </div>
    </section>

    <section id="contacts" class="section">
      <div class="section__head"><h2>Контакты</h2></div>
      <div class="contacts-grid">
        <a class="contact-card" href="tel:+79990000000"><span>Телефон</span><b>+7 (999) 000-00-00</b></a>
        <a class="contact-card" href="https://t.me/kontora" target="_blank" rel="noreferrer"><span>Telegram</span><b>@kontora</b></a>
        <a class="contact-card" href="https://wa.me/79990000000" target="_blank" rel="noreferrer"><span>WhatsApp</span><b>Написать</b></a>
      </div>
      <footer>© <span id="year"></span> .kontora</footer>
    </section>
  </main>

  <dialog id="detailsModal" class="modal">
    <button id="closeModal" class="modal__close" type="button">✕</button>
    <div id="modalContent"></div>
  </dialog>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script defer src="firebase-init.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
